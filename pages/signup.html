<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — E-commerce Cosmetics Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../cssFile/globalStyles.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="form-container">
    <h2>Create Account 💄</h2>
    <p>Join E-commerce Cosmetics Store and enjoy exclusive deals.</p>
    <form onsubmit="registerUser(event)">
      <div><label>Full Name</label><input type="text" id="rname" placeholder="Enter your full name" required></div>
      <div><label>Email Address</label><input type="email" id="remail" placeholder="Enter your email" required></div>
      <div><label>Password</label><input type="password" id="rpassword" placeholder="Min 6 characters" required></div>
      <div><label>Confirm Password</label><input type="password" id="rconfirm" placeholder="Confirm your password" required></div>
      <button type="submit">Create Account</button>
    </form>
    <br>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <footer>
    <div class="footer-container">
      <div><h2>E-commerce Cosmetics Store</h2><p>Premium beauty products for everyone.</p></div>
      <div>
        <h3>Pages</h3>
        <a href="../index.html">Home</a>
        <a href="login.html">Login</a>
      </div>
    </div>
    <p>© 2026 E-commerce Cosmetics Store. All rights reserved.</p>
  </footer>

  <script src="../jsFile/jsFunction.js"></script>
  <script>
    window.onload = function(){ loadNavbar(); };
  </script>

</body>
</html>
